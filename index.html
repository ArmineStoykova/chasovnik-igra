<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Приключения с часовника 💜</title><style>*{box-sizing:border-box}body{margin:0;font:17px system-ui,Arial;background:linear-gradient(145deg,#f3e9ff,#e3d3ff);color:#39235c;min-height:100vh}.wrap{max-width:660px;margin:auto;padding:22px 14px}h1{text-align:center;font-size:clamp(26px,6vw,38px);margin:12px 0}p{text-align:center}.panel{background:white;border:2px solid #d4b7f5;border-radius:24px;padding:20px;box-shadow:0 10px 25px #7b42b122}button,select{font:inherit;border-radius:14px;padding:12px 14px;border:2px solid #8d5bc5;background:#f5edff;color:#48286b;cursor:pointer;font-weight:650}button:focus-visible,select:focus-visible{outline:3px solid #ef72c0}button.active,.primary{background:#7740b2;color:white}.tabs,.answers,.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:14px 0}.answers button{min-width:115px}.clock{display:block;width:min(100%,340px);margin:8px auto}#prompt{text-align:center;font-weight:750;font-size:24px;min-height:64px}#feedback{text-align:center;font-weight:700;min-height:36px}#score{text-align:center;font-size:16px}label{display:inline-flex;align-items:center;gap:8px}select{max-width:160px}.hidden{display:none!important}.hint{text-align:center;color:#6d5585;font-size:14px}.footer{text-align:center;font-size:13px;margin-top:16px}</style></head><body><div class="wrap"><h1>💜 Приключения с часовника</h1><p>Научи часовете, минутите и следобедното време!</p><div class="panel"><div class="tabs"><button id="read" class="active">🕒 Познай часа</button><button id="set">🪄 Настрой стрелките</button></div><div class="controls"><label>Ниво <select id="level"><option value="0">Цели часове</option><option value="1">Половинки</option><option value="2">Четвъртинки</option><option value="3">През 5 минути</option><option value="4">Всички минути</option></select></label><label><input id="format" type="checkbox" checked> 24-часов формат</label></div><div id="score">⭐ 0 точки</div><div id="prompt"></div><svg class="clock" id="clock" viewBox="0 0 300 300" role="img" aria-label="Аналогов часовник"><circle cx="150" cy="150" r="142" fill="#fffafc" stroke="#aa72d4" stroke-width="8"/><g id="ticks"></g><g id="nums"></g><line id="hourhand" x1="150" y1="150" x2="150" y2="86" stroke="#513477" stroke-width="10" stroke-linecap="round"/><line id="minhand" x1="150" y1="150" x2="150" y2="55" stroke="#ec69ac" stroke-width="6" stroke-linecap="round"/><circle cx="150" cy="150" r="8" fill="#513477"/></svg><p class="hint">Малката лилава стрелка показва часа, а дългата розова — минутите.</p><div id="answers" class="answers"></div><div id="setting" class="controls hidden"><label>Час <select id="hours"></select></label><label>Минути <select id="minutes"></select></label></div><div class="controls"><button class="primary" id="check">Провери ✓</button><button id="next">Следваща задача →</button></div><div id="feedback" aria-live="polite"></div></div><div class="footer">Учи със забавление! 💜</div></div><script>
const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n);let mode='read',score=0,target={h:13,m:0},selected=null,locked=false;
for(let i=0;i<60;i++){let a=i*Math.PI/30,major=i%5===0;let line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',150+Math.sin(a)*(major?120:128));line.setAttribute('y1',150-Math.cos(a)*(major?120:128));line.setAttribute('x2',150+Math.sin(a)*134);line.setAttribute('y2',150-Math.cos(a)*134);line.setAttribute('stroke',major?'#a47cc5':'#e1d4e9');line.setAttribute('stroke-width',major?2.5:1);$('ticks').append(line)}
for(let i=1;i<=12;i++){let a=i*Math.PI/6,t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',150+Math.sin(a)*105);t.setAttribute('y',157-Math.cos(a)*105);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','22');t.setAttribute('font-weight','700');t.setAttribute('fill','#503573');t.textContent=i;$('nums').append(t)}
for(let i=0;i<24;i++)$('hours').add(new Option(String(i).padStart(2,'0'),i));for(let i=0;i<60;i++)$('minutes').add(new Option(String(i).padStart(2,'0'),i));
function fmt(h,m){return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function draw(h,m){let ha=((h%12)+m/60)*Math.PI/6,ma=m*Math.PI/30;for(let [id,a,len] of [['hourhand',ha,66],['minhand',ma,93]]){$(id).setAttribute('x2',150+Math.sin(a)*len);$(id).setAttribute('y2',150-Math.cos(a)*len)}}
function minutes(){let lv=+$('level').value;return lv===0?[0]:lv===1?[0,30]:lv===2?[0,15,30,45]:lv===3?Array.from({length:12},(_,i)=>i*5):Array.from({length:60},(_,i)=>i)}
function newTask(){locked=false;selected=null;$('feedback').textContent='';$('check').disabled=false;let is24=$('format').checked;target={h:rand(is24?24:12)+(is24?0:1),m:minutes()[rand(minutes().length)]};$('hours').value=target.h;$('minutes').value=target.m;render()}
function render(){let read=mode==='read';$('read').classList.toggle('active',read);$('set').classList.toggle('active',!read);$('answers').classList.toggle('hidden',!read);$('setting').classList.toggle('hidden',read);$('prompt').textContent=read?'Колко е часът?':'Настрой часовника на '+fmt(target.h,target.m);if(read){draw(target.h,target.m);let options=[fmt(target.h,target.m)];while(options.length<4){let h=rand($('format').checked?24:12)+($('format').checked?0:1),m=minutes()[rand(minutes().length)],s=fmt(h,m);if(!options.includes(s))options.push(s)}options.sort(()=>Math.random()-.5);$('answers').replaceChildren();options.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{selected=v;document.querySelectorAll('#answers button').forEach(x=>x.classList.toggle('active',x===b))};$('answers').append(b)})}else{let h=+$('hours').value,m=+$('minutes').value;draw(h,m)}}
$('hours').onchange=$('minutes').onchange=()=>{if(mode==='set')draw(+$('hours').value,+$('minutes').value)};
$('read').onclick=()=>{mode='read';newTask()};$('set').onclick=()=>{mode='set';newTask()};$('level').onchange=newTask;$('format').onchange=newTask;$('next').onclick=newTask;
$('check').onclick=()=>{if(locked)return;let answer=mode==='read'?selected:fmt(+$('hours').value,+$('minutes').value);if(answer===null){$('feedback').textContent='Избери отговор 💜';return}if(answer===fmt(target.h,target.m)){score++;$('score').textContent='⭐ '+score+' точки';$('feedback').textContent='Браво! Правилен отговор! 🎉';locked=true;$('check').disabled=true}else $('feedback').textContent='Опитай пак! Погледни внимателно стрелките 💜'};
newTask();</script></body></html>
